<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse 160% 90% at 50% 20%,
    #1a6040 0%, #0d3a22 28%, #062014 56%, #020d08 82%, #010503 100%);
}
.panel{
  position:absolute;top:0;bottom:0;width:50%;
  background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.01) 45%,rgba(0,0,0,.08) 100%);
  border:1px solid rgba(201,164,92,.12);
}
.panel.left{left:0;border-right:none;}
.panel.right{right:0;border-left:none;}
.panel .tl,.panel .tr,.panel .bl,.panel .br{
  position:absolute;width:16px;height:16px;
  border-style:solid;border-color:rgba(201,164,92,.65);
}
.panel .tl{top:7px;left:7px;border-width:2px 0 0 2px;}
.panel .tr{top:7px;right:7px;border-width:2px 2px 0 0;}
.panel .bl{bottom:7px;left:7px;border-width:0 0 2px 2px;}
.panel .br{bottom:7px;right:7px;border-width:0 2px 2px 0;}
.beam{
  position:absolute;top:0;bottom:0;left:50%;width:36px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    transparent 0%,rgba(180,240,180,.28) 15%,
    rgba(200,255,200,.42) 50%,rgba(180,240,180,.28) 85%,transparent 100%);
  filter:blur(7px);pointer-events:none;
  animation:glow 4s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
.seam{
  position:absolute;top:0;bottom:0;left:50%;width:2px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    transparent 0%,#c9a45c 12%,#e8c878 50%,#c9a45c 88%,transparent 100%);
  box-shadow:0 0 8px 1px rgba(201,164,92,.6);
}
.knob{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f0fff4 0%,#c8f0d8 50%,#90d0a8 100%);
  border:2.5px solid rgba(201,164,92,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;
  box-shadow:
    0 0 0 6px rgba(201,164,92,.18),
    0 0 0 11px rgba(201,164,92,.07),
    0 5px 16px rgba(6,32,20,.55);
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 6px rgba(201,164,92,.18),0 0 0 11px rgba(201,164,92,.07),0 5px 16px rgba(6,32,20,.55)}
  50%{box-shadow:0 0 0 9px rgba(201,164,92,.13),0 0 0 16px rgba(201,164,92,.05),0 5px 22px rgba(6,32,20,.65)}
}
.leaf{position:absolute;font-size:9px;opacity:0;animation:fall 7s ease-in infinite;}
.l1{left:15%;animation-delay:0s}
.l2{left:75%;animation-delay:2.2s}
.l3{left:40%;animation-delay:4.5s}
.l4{left:60%;animation-delay:1.2s}
.l5{left:28%;animation-delay:3.5s}
@keyframes fall{
  0%{top:-5%;opacity:0;transform:rotate(-15deg)}
  12%{opacity:.55}
  88%{opacity:.3}
  100%{top:105%;opacity:0;transform:rotate(25deg)}
}
</style>
</head>
<body>
<div class="panel left"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div></div>
<div class="panel right"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div></div>
<div class="beam"></div>
<div class="seam"></div>
<div class="knob">🌿</div>
<div class="leaf l1">🍃</div>
<div class="leaf l2">🌿</div>
<div class="leaf l3">🍃</div>
<div class="leaf l4">🌿</div>
<div class="leaf l5">🍃</div>
</body>
</html>
