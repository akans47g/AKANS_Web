<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse 160% 90% at 50% 20%,
    #2d5a30 0%, #1a3a1e 28%, #0c2010 56%, #040e06 82%, #010502 100%);
}
.panel{
  position:absolute;top:0;bottom:0;width:50%;
  background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.01) 45%,rgba(0,0,0,.08) 100%);
  border:1px solid rgba(184,160,112,.12);
}
.panel.left{left:0;border-right:none;}
.panel.right{right:0;border-left:none;}
.panel .tl,.panel .tr,.panel .bl,.panel .br{
  position:absolute;width:16px;height:16px;
  border-style:solid;border-color:rgba(184,160,112,.6);
}
.panel .tl{top:7px;left:7px;border-width:2px 0 0 2px;}
.panel .tr{top:7px;right:7px;border-width:2px 2px 0 0;}
.panel .bl{bottom:7px;left:7px;border-width:0 0 2px 2px;}
.panel .br{bottom:7px;right:7px;border-width:0 2px 2px 0;}
.beam{
  position:absolute;top:0;bottom:0;left:50%;width:36px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    transparent 0%,rgba(255,220,180,.22) 15%,
    rgba(255,240,200,.35) 50%,rgba(255,220,180,.22) 85%,transparent 100%);
  filter:blur(7px);pointer-events:none;
  animation:glow 4.5s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.9}}
.seam{
  position:absolute;top:0;bottom:0;left:50%;width:2px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    transparent 0%,#b8a070 12%,#d4c090 50%,#b8a070 88%,transparent 100%);
  box-shadow:0 0 7px 1px rgba(184,160,112,.5);
}
.knob{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff8f0 0%,#fce8d8 50%,#f0d0b8 100%);
  border:2.5px solid rgba(184,160,112,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;
  box-shadow:
    0 0 0 6px rgba(184,160,112,.18),
    0 0 0 11px rgba(184,160,112,.07),
    0 5px 16px rgba(12,32,16,.55);
  animation:pulse 3.2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 6px rgba(184,160,112,.18),0 0 0 11px rgba(184,160,112,.07),0 5px 16px rgba(12,32,16,.55)}
  50%{box-shadow:0 0 0 9px rgba(184,160,112,.13),0 0 0 16px rgba(184,160,112,.05),0 5px 22px rgba(12,32,16,.65)}
}
.petal{position:absolute;font-size:9px;opacity:0;animation:fall 8s ease-in infinite;}
.p1{left:12%;animation-delay:0s}
.p2{left:30%;animation-delay:2s}
.p3{left:52%;animation-delay:4s}
.p4{left:70%;animation-delay:1s}
.p5{left:85%;animation-delay:3s}
.p6{left:42%;animation-delay:5.5s}
@keyframes fall{
  0%{top:-5%;opacity:0;transform:rotate(-20deg)}
  12%{opacity:.6}
  88%{opacity:.25}
  100%{top:105%;opacity:0;transform:rotate(30deg)}
}
</style>
</head>
<body>
<div class="panel left"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div></div>
<div class="panel right"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div></div>
<div class="beam"></div>
<div class="seam"></div>
<div class="knob">🌷</div>
<div class="petal p1">🌸</div>
<div class="petal p2">🌺</div>
<div class="petal p3">🌸</div>
<div class="petal p4">🌺</div>
<div class="petal p5">🌸</div>
<div class="petal p6">🌺</div>
</body>
</html>
