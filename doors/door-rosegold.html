<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse 160% 90% at 50% 20%,
    #c0607a 0%, #8a3040 28%, #501820 56%, #1e0809 82%, #0a0203 100%);
}
.panel{
  position:absolute;top:0;bottom:0;width:50%;
  background:linear-gradient(115deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.02) 45%,rgba(0,0,0,.06) 100%);
  border:1px solid rgba(212,160,112,.14);
}
.panel.left{left:0;border-right:none;}
.panel.right{right:0;border-left:none;}
.panel .tl,.panel .tr,.panel .bl,.panel .br{
  position:absolute;width:16px;height:16px;
  border-style:solid;border-color:rgba(212,160,112,.6);
}
.panel .tl{top:7px;left:7px;border-width:2px 0 0 2px;}
.panel .tr{top:7px;right:7px;border-width:2px 2px 0 0;}
.panel .bl{bottom:7px;left:7px;border-width:0 0 2px 2px;}
.panel .br{bottom:7px;right:7px;border-width:0 2px 2px 0;}
.beam{
  position:absolute;top:0;bottom:0;left:50%;width:36px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    transparent 0%,rgba(255,200,190,.3) 15%,
    rgba(255,220,210,.45) 50%,rgba(255,200,190,.3) 85%,transparent 100%);
  filter:blur(7px);pointer-events:none;
  animation:glow 3.8s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
.seam{
  position:absolute;top:0;bottom:0;left:50%;width:2px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    transparent 0%,#d4a070 12%,#ecc090 50%,#d4a070 88%,transparent 100%);
  box-shadow:0 0 8px 1px rgba(212,160,112,.55);
}
.knob{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff8fa 0%,#fde8e8 50%,#f0c8d0 100%);
  border:2.5px solid rgba(212,160,112,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;
  box-shadow:
    0 0 0 6px rgba(212,160,112,.2),
    0 0 0 11px rgba(212,160,112,.08),
    0 5px 16px rgba(50,15,25,.6);
  animation:pulse 2.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 6px rgba(212,160,112,.2),0 0 0 11px rgba(212,160,112,.08),0 5px 16px rgba(50,15,25,.6)}
  50%{box-shadow:0 0 0 10px rgba(212,160,112,.14),0 0 0 18px rgba(212,160,112,.05),0 5px 22px rgba(50,15,25,.75)}
}
.glitter{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(255,220,200,.8);
  animation:shimmer 4s ease-in-out infinite;
}
.g1{top:18%;left:20%;animation-delay:0s}
.g2{top:28%;right:20%;animation-delay:.8s}
.g3{top:12%;right:38%;animation-delay:1.6s}
.g4{bottom:32%;left:18%;animation-delay:.4s}
.g5{bottom:22%;right:26%;animation-delay:1.4s}
.g6{top:55%;left:12%;animation-delay:2.2s}
.g7{top:42%;right:14%;animation-delay:.6s}
@keyframes shimmer{
  0%,100%{opacity:.15;transform:scale(1)}
  50%{opacity:1;transform:scale(2.8)}
}
</style>
</head>
<body>
<div class="panel left"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div></div>
<div class="panel right"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div></div>
<div class="beam"></div>
<div class="seam"></div>
<div class="knob">💎</div>
<div class="glitter g1"></div>
<div class="glitter g2"></div>
<div class="glitter g3"></div>
<div class="glitter g4"></div>
<div class="glitter g5"></div>
<div class="glitter g6"></div>
<div class="glitter g7"></div>
</body>
</html>
