<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}

body{
  background:radial-gradient(ellipse 160% 90% at 50% 20%,
    #1a2a6c 0%, #0e1848 28%, #060d2c 56%, #020510 82%, #010208 100%);
}

/* ── Two door panels ── */
.panel{
  position:absolute;top:0;bottom:0;width:50%;
  background:linear-gradient(115deg,
    rgba(255,255,255,.07) 0%, rgba(255,255,255,.01) 45%,
    rgba(0,0,0,.08) 100%);
  border:1px solid rgba(168,200,255,.1);
}
.panel.left{left:0; border-right:none;}
.panel.right{right:0; border-left:none;}

/* ── Corner brackets (silver) ── */
.panel .tl,.panel .tr,.panel .bl,.panel .br{
  position:absolute;width:16px;height:16px;
  border-style:solid;border-color:rgba(180,210,255,.6);
}
.panel .tl{top:7px;left:7px; border-width:2px 0 0 2px;}
.panel .tr{top:7px;right:7px; border-width:2px 2px 0 0;}
.panel .bl{bottom:7px;left:7px; border-width:0 0 2px 2px;}
.panel .br{bottom:7px;right:7px; border-width:0 2px 2px 0;}

/* ── Silver glow beam ── */
.beam{
  position:absolute;top:0;bottom:0;left:50%;width:36px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    transparent 0%, rgba(180,210,255,.28) 15%,
    rgba(210,230,255,.45) 50%, rgba(180,210,255,.28) 85%, transparent 100%);
  filter:blur(7px);pointer-events:none;
  animation:glow 4s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}

/* ── Center vertical seam (silver) ── */
.seam{
  position:absolute;top:0;bottom:0;left:50%;width:2px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    transparent 0%, #a8c8ff 12%, #cce0ff 50%, #a8c8ff 88%, transparent 100%);
  box-shadow:0 0 8px 1px rgba(168,200,255,.55);
}

/* ── W knob ── */
.knob{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,
    #ffffff 0%, #e8f0ff 50%, #c8d8ff 100%);
  border:2.5px solid rgba(168,200,255,.9);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-family:Cinzel,serif;font-weight:700;color:#0e1848;
  letter-spacing:-1px;
  box-shadow:
    0 0 0 6px rgba(168,200,255,.15),
    0 0 0 11px rgba(168,200,255,.06),
    0 5px 16px rgba(1,3,14,.7);
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 6px rgba(168,200,255,.15),0 0 0 11px rgba(168,200,255,.06),0 5px 16px rgba(1,3,14,.7)}
  50%{box-shadow:0 0 0 9px rgba(168,200,255,.1),0 0 0 16px rgba(168,200,255,.04),0 5px 22px rgba(1,3,14,.8)}
}

/* ── Twinkling stars ── */
.star{
  position:absolute;border-radius:50%;
  background:#a8c8ff;
  animation:twinkle 3s ease-in-out infinite;
}
.s1{width:3px;height:3px;top:12%;left:20%;animation-delay:0s}
.s2{width:4px;height:4px;top:22%;right:16%;animation-delay:.9s}
.s3{width:2px;height:2px;top:8%;right:32%;animation-delay:1.8s}
.s4{width:3px;height:3px;bottom:28%;left:14%;animation-delay:.4s}
.s5{width:2px;height:2px;bottom:18%;right:24%;animation-delay:1.3s}
.s6{width:4px;height:4px;top:55%;left:12%;animation-delay:2.2s}
.s7{width:2px;height:2px;top:40%;right:13%;animation-delay:.6s}

@keyframes twinkle{
  0%,100%{opacity:.25;transform:scale(1)}
  50%{opacity:1;transform:scale(2.2)}
}

/* ── Crescent moon decoration ── */
.moon{
  position:absolute;top:15%;right:22%;
  width:16px;height:16px;
  border-radius:50%;
  box-shadow:-5px 1px 0 1px #a8c8ff;
  opacity:.45;
  animation:moonGlow 5s ease-in-out infinite;
}
@keyframes moonGlow{0%,100%{opacity:.35}50%{opacity:.6}}
</style>
</head>
<body>

<div class="panel left">
  <div class="tl"></div><div class="tr"></div>
  <div class="bl"></div><div class="br"></div>
</div>
<div class="panel right">
  <div class="tl"></div><div class="tr"></div>
  <div class="bl"></div><div class="br"></div>
</div>

<div class="beam"></div>
<div class="seam"></div>
<div class="knob">W</div>

<div class="star s1"></div>
<div class="star s2"></div>
<div class="star s3"></div>
<div class="star s4"></div>
<div class="star s5"></div>
<div class="star s6"></div>
<div class="star s7"></div>
<div class="moon"></div>

</body>
</html>
