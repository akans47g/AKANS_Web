<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Users — AKANS Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="manifest" href="admin-manifest.json"/>
<meta name="theme-color" content="#2563eb"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="AKANS Admin"/>
<style>
:root{
  --bg:#f1f5f9;--surface:#ffffff;--surface2:#f8fafc;
  --border:#e2e8f0;--fg:#0f172a;--fg2:#475569;--fg3:#94a3b8;
  --accent:#2563eb;--accent-lt:#eff6ff;
  --success:#16a34a;--warn:#d97706;--danger:#dc2626;
  --nav-h:64px;--radius:12px;--shadow:0 1px 4px rgba(0,0,0,0.07);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);overflow-x:hidden;}

.admin-main{display:flex;flex-direction:column;min-height:100vh;}

/* HEADER */
.admin-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0.85rem 1.1rem;display:flex;align-items:center;gap:0.8rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-title{font-size:1rem;font-weight:800;color:var(--fg);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:0.6rem;}
.header-admin-name{display:flex;align-items:center;gap:0.45rem;font-size:0.8rem;font-weight:700;color:var(--fg);}
.header-av{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.72rem;font-weight:800;}
.hdr-btn{display:flex;align-items:center;gap:0.4rem;padding:0.45rem 0.9rem;border-radius:9px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:1.5px solid;transition:all 0.2s;}
.hdr-btn-export{background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.hdr-btn-export:hover{background:var(--success);color:#fff;border-color:var(--success);}
.install-btn{display:none;align-items:center;gap:0.4rem;padding:0.42rem 0.8rem;border-radius:9px;font-size:0.76rem;font-weight:700;background:var(--accent-lt);color:var(--accent);border:1.5px solid #bfdbfe;cursor:pointer;font-family:'Inter',sans-serif;}

/* CONTENT */
.admin-content{padding:1.1rem;flex:1;padding-bottom:calc(var(--nav-h) + 16px);}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0.8rem;margin-bottom:1.2rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0.9rem 1rem;box-shadow:var(--shadow);text-align:center;transition:transform 0.2s;}
.stat-card:hover{transform:translateY(-2px);}
.stat-emoji{font-size:1.4rem;display:block;margin-bottom:0.25rem;}
.stat-num{font-size:1.5rem;font-weight:800;display:block;line-height:1;}
.stat-lbl{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg3);margin-top:0.2rem;display:block;}
.sc-blue  .stat-num{color:var(--accent);}
.sc-green .stat-num{color:var(--success);}
.sc-gold  .stat-num{color:#f59e0b;}
.sc-red   .stat-num{color:var(--danger);}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.9rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:200px;display:flex;align-items:center;gap:0.5rem;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:0 0.85rem;transition:border-color 0.2s;}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.08);}
.search-input{flex:1;border:none;background:transparent;outline:none;font-size:0.84rem;font-family:'Inter',sans-serif;color:var(--fg);padding:0.58rem 0;}
.search-input::placeholder{color:var(--fg3);}
.sort-select{padding:0.54rem 0.8rem;border:1.5px solid var(--border);border-radius:10px;font-size:0.78rem;font-family:'Inter',sans-serif;font-weight:600;color:var(--fg2);outline:none;cursor:pointer;background:var(--surface);}
.showing-txt{font-size:0.74rem;color:var(--fg3);font-weight:600;white-space:nowrap;}

/* FILTER TABS */
.usr-tabs{display:flex;gap:0.3rem;margin-bottom:0.9rem;flex-wrap:wrap;}
.usr-tab{display:flex;align-items:center;gap:0.3rem;padding:0.36rem 0.85rem;border-radius:30px;border:1.5px solid var(--border);background:var(--surface);font-size:0.74rem;font-weight:700;color:var(--fg2);cursor:pointer;transition:all 0.18s;font-family:'Inter',sans-serif;white-space:nowrap;}
.usr-tab:hover{border-color:rgba(37,99,235,0.3);color:var(--accent);background:var(--accent-lt);}
.usr-tab.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(37,99,235,0.3);}

/* USERS GRID */
.users-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:0.9rem;}

/* USER CARD */
.usr-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem;box-shadow:var(--shadow);transition:transform 0.2s,box-shadow 0.2s;animation:cardIn 0.3s ease both;}
.usr-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08);}
.usr-card.usr-blocked{border-left:3px solid var(--danger);opacity:0.82;}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.usr-card-top{display:flex;align-items:flex-start;gap:0.75rem;margin-bottom:0.8rem;}
.usr-avatar-wrap{position:relative;flex-shrink:0;}
.usr-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:0.98rem;}
.usr-avatar-img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
.usr-blocked-dot{position:absolute;bottom:-2px;right:-2px;font-size:0.72rem;background:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
.usr-info{flex:1;min-width:0;}
.usr-name{font-size:0.88rem;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.18rem;}
.usr-admin-badge{font-size:0.61rem;font-weight:700;color:#f59e0b;background:#fffbeb;border:1px solid #fde68a;padding:0.12rem 0.48rem;border-radius:20px;}
.usr-email{font-size:0.74rem;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0.12rem;}
.usr-wa{font-size:0.72rem;color:var(--success);font-weight:600;}

.usr-meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.4rem;margin-bottom:0.8rem;}
.usr-meta-item{background:var(--surface2);border-radius:8px;padding:0.42rem 0.5rem;text-align:center;}
.usr-meta-label{display:block;font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg3);margin-bottom:0.1rem;}
.usr-meta-val{font-size:0.74rem;font-weight:700;color:var(--fg);}

.usr-actions{display:flex;gap:0.35rem;flex-wrap:wrap;}
.usr-btn{display:flex;align-items:center;justify-content:center;gap:0.3rem;padding:0.38rem 0.65rem;border-radius:8px;font-size:0.73rem;font-weight:700;cursor:pointer;border:1.5px solid;font-family:'Inter',sans-serif;text-decoration:none;transition:all 0.18s;white-space:nowrap;}
.usr-btn-view   {background:var(--accent-lt);color:var(--accent);border-color:#bfdbfe;flex:1;}
.usr-btn-view:hover   {background:var(--accent);color:#fff;border-color:var(--accent);}
.usr-btn-wa     {background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.usr-btn-wa:hover     {background:var(--success);color:#fff;border-color:var(--success);}
.usr-btn-block  {background:#fef2f2;color:var(--danger);border-color:#fecaca;}
.usr-btn-block:hover  {background:var(--danger);color:#fff;border-color:var(--danger);}
.usr-btn-unblock{background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.usr-btn-unblock:hover{background:var(--success);color:#fff;}
.usr-btn-delete {background:#fef2f2;color:var(--danger);border-color:#fecaca;}
.usr-btn-delete:hover {background:var(--danger);color:#fff;}

/* LOADING + EMPTY */
.usr-loading{display:flex;flex-direction:column;align-items:center;gap:0.75rem;padding:3rem;color:var(--fg3);font-size:0.85rem;grid-column:1/-1;}
.usr-spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.usr-empty{display:flex;flex-direction:column;align-items:center;gap:0.55rem;padding:3rem;grid-column:1/-1;}
.usr-empty-icon{font-size:2.8rem;opacity:0.4;}
.usr-empty-title{font-size:1.05rem;font-weight:700;color:var(--fg2);}
.usr-empty-sub{font-size:0.82rem;color:var(--fg3);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--surface);border-radius:20px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,0.25);animation:modalIn 0.3s ease both;margin:auto;overflow:hidden;}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:0.95rem 1.2rem;border-bottom:1px solid var(--border);}
.modal-title{font-size:0.95rem;font-weight:800;color:var(--fg);}
.modal-close{background:none;border:none;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--fg2);transition:all 0.2s;}
.modal-close:hover{background:#fef2f2;color:var(--danger);}

/* User modal detail styles */
.umd-body{padding:1.2rem;max-height:75vh;overflow-y:auto;}
.umd-profile{display:flex;align-items:center;gap:1rem;margin-bottom:1.1rem;padding-bottom:1.1rem;border-bottom:1px solid var(--border);}
.umd-avatar{width:58px;height:58px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.35rem;flex-shrink:0;}
.umd-avatar-img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--border);flex-shrink:0;}
.umd-name{font-size:1.05rem;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap;margin-bottom:0.18rem;}
.umd-email{font-size:0.8rem;color:var(--fg2);margin-bottom:0.12rem;}
.umd-joined{font-size:0.73rem;color:var(--fg3);}
.umd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.45rem;margin-bottom:1rem;}
.umd-stat{background:var(--surface2);border-radius:10px;padding:0.65rem 0.45rem;text-align:center;}
.umd-stat span{display:block;font-size:1.05rem;font-weight:800;color:var(--accent);margin-bottom:0.18rem;}
.umd-stat{font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg3);}
.umd-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.45rem;margin-bottom:1rem;}
.umd-detail{background:var(--surface2);border-radius:10px;padding:0.55rem 0.75rem;}
.umd-dl{display:block;font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg3);margin-bottom:0.12rem;}
.umd-dv{font-size:0.82rem;font-weight:600;color:var(--fg);word-break:break-all;}
.umd-section{margin-bottom:0.95rem;}
.umd-sec-title{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--fg3);margin-bottom:0.65rem;}
.umd-action-row{display:flex;gap:0.45rem;flex-wrap:wrap;}
.umd-btn{display:flex;align-items:center;justify-content:center;gap:0.3rem;padding:0.52rem 0.85rem;border-radius:10px;font-size:0.78rem;font-weight:700;cursor:pointer;border:1.5px solid;font-family:'Inter',sans-serif;text-decoration:none;transition:all 0.2s;white-space:nowrap;}
.umd-btn-make-admin  {background:#fffbeb;color:#b45309;border-color:#fde68a;}
.umd-btn-make-admin:hover{background:#f59e0b;color:#fff;border-color:#f59e0b;}
.umd-btn-remove-admin{background:var(--surface2);color:var(--fg2);border-color:var(--border);}
.umd-btn-remove-admin:hover{background:var(--fg2);color:#fff;}
.umd-btn-block  {background:#fef2f2;color:var(--danger);border-color:#fecaca;}
.umd-btn-block:hover  {background:var(--danger);color:#fff;}
.umd-btn-unblock{background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.umd-btn-unblock:hover{background:var(--success);color:#fff;}
.umd-btn-wa{background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.umd-btn-wa:hover{background:var(--success);color:#fff;}
.umd-order-row{display:flex;align-items:center;gap:0.75rem;justify-content:space-between;padding:0.55rem 0.75rem;background:var(--surface2);border-radius:9px;margin-bottom:0.4rem;font-size:0.8rem;}

/* TOAST */
.admin-toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(20px);font-size:0.82rem;font-weight:700;padding:0.65rem 1.4rem;border-radius:30px;opacity:0;white-space:nowrap;transition:opacity 0.25s,transform 0.25s;z-index:9999;pointer-events:none;font-family:'Inter',sans-serif;}
.admin-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.admin-toast.success{background:#166534;color:#bbf7d0;border:1px solid #15803d;}
.admin-toast.error  {background:#7f1d1d;color:#fca5a5;border:1px solid #b91c1c;}
.admin-toast.warning{background:#78350f;color:#fde68a;border:1px solid #b45309;}
.admin-toast.info   {background:#1e3a8a;color:#bfdbfe;border:1px solid #1d4ed8;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,0.08);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.22rem;text-decoration:none;color:var(--fg3);border:none;background:none;cursor:pointer;font-family:'Inter',sans-serif;transition:color 0.18s;padding:0;}
.bn-item:hover,.bn-item.active{color:var(--accent);}
.bn-icon{font-size:1.25rem;line-height:1;}
.bn-label{font-size:0.6rem;font-weight:600;letter-spacing:0.04em;}

/* MORE MENU */
.more-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:none;}
.more-overlay.open{display:block;}
.more-menu{position:fixed;bottom:0;left:0;right:0;z-index:310;background:var(--surface);border-radius:20px 20px 0 0;padding:0.6rem 1.2rem 2rem;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 -8px 30px rgba(0,0,0,0.15);}
.more-menu.open{transform:translateY(0);}
.more-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0.5rem auto 1rem;}
.more-title{font-size:0.72rem;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.85rem;}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;}
.mm-item{display:flex;flex-direction:column;align-items:center;gap:0.35rem;padding:0.75rem 0.5rem;border-radius:12px;background:var(--surface2);text-decoration:none;color:var(--fg2);border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.18s;}
.mm-item:hover,.mm-item.mm-active{background:var(--accent-lt);color:var(--accent);}
.mm-item.mm-logout{color:var(--danger);}
.mm-item.mm-logout:hover{background:#fef2f2;}
.mm-icon{font-size:1.4rem;}
.mm-label{font-size:0.67rem;font-weight:600;text-align:center;}

@media(max-width:768px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .users-grid{grid-template-columns:1fr;}
  .umd-stats{grid-template-columns:1fr 1fr;}
  .umd-detail-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<main class="admin-main" id="usersPage">

  <!-- HEADER -->
  <header class="admin-header">
    <div class="header-title">👥 Users</div>
    <div class="header-right">
      <button class="hdr-btn hdr-btn-export" onclick="exportUsersCSV()">📥 Export CSV</button>
      <button class="install-btn" id="installBtn" onclick="installAdminApp()">📲 Install</button>
      <div class="header-admin-name">
        <div class="header-av">A</div>
        <span id="adminHeaderName">Admin</span>
      </div>
    </div>
  </header>

  <div class="admin-content">

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card sc-blue">
        <span class="stat-emoji">👥</span>
        <span class="stat-num" id="usr-stat-total">—</span>
        <span class="stat-lbl">Total Users</span>
      </div>
      <div class="stat-card sc-green">
        <span class="stat-emoji">🆕</span>
        <span class="stat-num" id="usr-stat-today">—</span>
        <span class="stat-lbl">New Today</span>
      </div>
      <div class="stat-card sc-gold">
        <span class="stat-emoji">👑</span>
        <span class="stat-num" id="usr-stat-admins">—</span>
        <span class="stat-lbl">Admins</span>
      </div>
      <div class="stat-card sc-red">
        <span class="stat-emoji">🚫</span>
        <span class="stat-num" id="usr-stat-blocked">—</span>
        <span class="stat-lbl">Blocked</span>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <span style="color:var(--fg3);">🔍</span>
        <input class="search-input" type="text"
               placeholder="Naam, email, WhatsApp se dhundho..."
               oninput="onUserSearch(this.value)"/>
      </div>
      <select class="sort-select" onchange="onUserSort(this.value)">
        <option value="newest">🕐 Newest First</option>
        <option value="oldest">🕐 Oldest First</option>
        <option value="name">🔤 Name A-Z</option>
      </select>
      <span class="showing-txt" id="usr-showing">Loading...</span>
    </div>

    <!-- FILTER TABS -->
    <div class="usr-tabs">
      <button class="usr-tab active" data-filter="all"     onclick="switchUserFilter('all')">All Users</button>
      <button class="usr-tab"        data-filter="new"     onclick="switchUserFilter('new')">🆕 Today</button>
      <button class="usr-tab"        data-filter="admin"   onclick="switchUserFilter('admin')">👑 Admins</button>
      <button class="usr-tab"        data-filter="blocked" onclick="switchUserFilter('blocked')">🚫 Blocked</button>
    </div>

    <!-- USERS GRID -->
    <div class="users-grid" id="usersGrid">
      <div class="usr-loading">
        <div class="usr-spinner"></div>
        <span>Users load ho rahe hain...</span>
      </div>
    </div>

  </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="admin-dashboard.html" class="bn-item"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></a>
  <a href="admin-bookings.html" class="bn-item"><span class="bn-icon">📦</span><span class="bn-label">Bookings</span></a>
  <a href="admin-templates.html" class="bn-item"><span class="bn-icon">🎨</span><span class="bn-label">Templates</span></a>
  <a href="admin-reviews.html" class="bn-item"><span class="bn-icon">⭐</span><span class="bn-label">Reviews</span></a>
  <button class="bn-item active" onclick="toggleMoreMenu()"><span class="bn-icon">⋯</span><span class="bn-label">More</span></button>
</nav>

<!-- MORE MENU -->
<div class="more-overlay" id="moreOverlay" onclick="toggleMoreMenu()"></div>
<div class="more-menu" id="moreMenu">
  <div class="more-handle"></div>
  <div class="more-title">More Pages</div>
  <div class="more-grid">
    <a href="admin-users.html" class="mm-item mm-active"><span class="mm-icon">👥</span><span class="mm-label">Users</span></a>
    <a href="admin-orders.html" class="mm-item"><span class="mm-icon">🛒</span><span class="mm-label">Orders</span></a>
    <a href="admin-coupons.html" class="mm-item"><span class="mm-icon">🎟️</span><span class="mm-label">Coupons</span></a>
    <a href="admin-referrals.html" class="mm-item"><span class="mm-icon">🔗</span><span class="mm-label">Referrals</span></a>
    <a href="admin-whatsapp.html" class="mm-item"><span class="mm-icon">💬</span><span class="mm-label">WhatsApp</span></a>
    <a href="admin-settings.html" class="mm-item"><span class="mm-icon">⚙️</span><span class="mm-label">Settings</span></a>
    <button class="mm-item mm-logout" onclick="adminLogout()"><span class="mm-icon">🚪</span><span class="mm-label">Logout</span></button>
  </div>
</div>

<!-- USER DETAIL MODAL -->

<script>
// Header avatar — preserved from original
const sess = JSON.parse(localStorage.getItem('adminSession')||'{}');
const av = document.querySelector('.header-av');
if(av && sess.displayName) av.textContent = sess.displayName.charAt(0).toUpperCase();

// More menu
function toggleMoreMenu(){
  const m=document.getElementById('moreMenu'),
        o=document.getElementById('moreOverlay'),
        open=m.classList.toggle('open');
  o.classList.toggle('open',open);
  document.body.style.overflow=open?'hidden':'';
}

// PWA Install
let _dp=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();_dp=e;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='flex';
});
function installAdminApp(){
  if(!_dp)return;
  _dp.prompt();
  _dp.userChoice.then(()=>{
    _dp=null;
    const b=document.getElementById('installBtn');
    if(b)b.style.display='none';
  });
}
window.addEventListener('appinstalled',()=>{
  _dp=null;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='none';
});
if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
