<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reviews — AKANS Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="manifest" href="admin-manifest.json"/>
<meta name="theme-color" content="#2563eb"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="AKANS Admin"/>
<style>
:root{
  --bg:#f1f5f9;--surface:#ffffff;--surface2:#f8fafc;
  --border:#e2e8f0;--fg:#0f172a;--fg2:#475569;--fg3:#94a3b8;
  --accent:#2563eb;--accent-lt:#eff6ff;
  --success:#16a34a;--warn:#d97706;--danger:#dc2626;
  --nav-h:64px;--radius:12px;--shadow:0 1px 4px rgba(0,0,0,0.07);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);overflow-x:hidden;}

.admin-main{display:flex;flex-direction:column;min-height:100vh;}

/* HEADER */
.admin-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0.85rem 1.1rem;display:flex;align-items:center;gap:0.8rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-title{font-size:1rem;font-weight:800;color:var(--fg);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:0.6rem;}
.header-admin-name{display:flex;align-items:center;gap:0.45rem;font-size:0.8rem;font-weight:700;color:var(--fg);}
.header-av{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.72rem;font-weight:800;}
.hdr-btn{display:flex;align-items:center;gap:0.4rem;padding:0.45rem 0.9rem;border-radius:9px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:1.5px solid;transition:all 0.2s;}
.hdr-btn-export{background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.hdr-btn-export:hover{background:var(--success);color:#fff;border-color:var(--success);}
.install-btn{display:none;align-items:center;gap:0.4rem;padding:0.42rem 0.8rem;border-radius:9px;font-size:0.76rem;font-weight:700;background:var(--accent-lt);color:var(--accent);border:1.5px solid #bfdbfe;cursor:pointer;font-family:'Inter',sans-serif;}

/* CONTENT */
.admin-content{padding:1.1rem;flex:1;padding-bottom:calc(var(--nav-h) + 16px);}

/* STATS CARDS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0.8rem;margin-bottom:1.2rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0.9rem 1rem;box-shadow:var(--shadow);text-align:center;transition:transform 0.2s;}
.stat-card:hover{transform:translateY(-2px);}
.stat-emoji{font-size:1.4rem;display:block;margin-bottom:0.25rem;}
.stat-num{font-size:1.5rem;font-weight:800;display:block;line-height:1;}
.stat-lbl{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg3);margin-top:0.2rem;display:block;}
.sc-yellow .stat-num{color:#f59e0b;}
.sc-green  .stat-num{color:var(--success);}
.sc-blue   .stat-num{color:var(--accent);}
.sc-purple .stat-num{color:#7c3aed;}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.9rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:200px;display:flex;align-items:center;gap:0.5rem;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:0 0.85rem;transition:border-color 0.2s;}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.08);}
.search-input{flex:1;border:none;background:transparent;outline:none;font-size:0.84rem;font-family:'Inter',sans-serif;color:var(--fg);padding:0.58rem 0;}
.search-input::placeholder{color:var(--fg3);}
.sort-select{padding:0.54rem 0.8rem;border:1.5px solid var(--border);border-radius:10px;font-size:0.78rem;font-family:'Inter',sans-serif;font-weight:600;color:var(--fg2);outline:none;cursor:pointer;background:var(--surface);}
.showing-txt{font-size:0.74rem;color:var(--fg3);font-weight:600;white-space:nowrap;}

/* FILTER TABS */
.rev-tabs{display:flex;gap:0.3rem;margin-bottom:0.9rem;flex-wrap:wrap;}
.rev-tab{display:flex;align-items:center;gap:0.3rem;padding:0.36rem 0.85rem;border-radius:30px;border:1.5px solid var(--border);background:var(--surface);font-size:0.74rem;font-weight:700;color:var(--fg2);cursor:pointer;transition:all 0.18s;font-family:'Inter',sans-serif;white-space:nowrap;}
.rev-tab:hover{border-color:rgba(37,99,235,0.3);color:var(--accent);background:var(--accent-lt);}
.rev-tab.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(37,99,235,0.3);}
.rev-tab-count{background:rgba(0,0,0,0.1);border-radius:20px;padding:0.05rem 0.42rem;font-size:0.67rem;}
.rev-tab.active .rev-tab-count{background:rgba(255,255,255,0.2);}

/* SELECT ALL ROW */
.select-row{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.75rem;font-size:0.78rem;color:var(--fg2);}
.select-row button{background:none;border:1.5px solid var(--border);border-radius:8px;padding:0.28rem 0.72rem;font-size:0.74rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;color:var(--fg2);transition:all 0.18s;}
.select-row button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-lt);}

/* BULK ACTION BAR */
.bulk-bar{
  position:sticky;top:68px;z-index:50;
  display:none;align-items:center;gap:0.8rem;
  background:#1e3a8a;border-radius:12px;
  padding:0.72rem 1rem;margin-bottom:0.9rem;
  box-shadow:0 4px 20px rgba(37,99,235,0.3);
  animation:slideDown 0.25s ease both;
}
.bulk-bar.show{display:flex;}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.bulk-count{font-size:0.84rem;font-weight:700;color:#fff;}
.bulk-count span{color:#60a5fa;}
.bulk-actions{display:flex;gap:0.45rem;margin-left:auto;}
.bulk-btn{padding:0.4rem 0.85rem;border-radius:8px;font-size:0.77rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all 0.2s;}
.bulk-btn-approve{background:var(--success);color:#fff;}
.bulk-btn-approve:hover{background:#15803d;}
.bulk-btn-delete{background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);}
.bulk-btn-delete:hover{background:#ef4444;color:#fff;}
.bulk-btn-clear{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);}
.bulk-btn-clear:hover{background:rgba(255,255,255,0.2);color:#fff;}

/* REVIEWS GRID */
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0.9rem;}

/* REVIEW CARD */
.rev-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem;box-shadow:var(--shadow);transition:transform 0.2s,box-shadow 0.2s;animation:cardIn 0.3s ease both;}
.rev-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08);}
.rev-card.rev-approved{border-left:3px solid var(--success);}
.rev-card.rev-pending {border-left:3px solid #f59e0b;}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.rev-card-top{display:flex;align-items:flex-start;gap:0.7rem;margin-bottom:0.75rem;}
.rev-checkbox{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:3px;}
.rev-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:0.82rem;}
.rev-meta{flex:1;min-width:0;}
.rev-name{font-size:0.9rem;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rev-template{font-size:0.72rem;color:#6366f1;font-weight:600;margin-top:0.1rem;}
.rev-right{text-align:right;flex-shrink:0;}
.rev-stars{font-size:0.84rem;letter-spacing:1px;}
.rev-date{font-size:0.67rem;color:var(--fg3);margin-top:0.2rem;}

.rev-text{font-size:0.82rem;color:var(--fg2);line-height:1.65;margin-bottom:0.8rem;padding:0.65rem 0.8rem;background:var(--surface2);border-radius:10px;font-style:italic;border-left:3px solid var(--border);}
.rev-card.rev-approved .rev-text{border-left-color:var(--success);}
.rev-card.rev-pending  .rev-text{border-left-color:#f59e0b;}

.rev-footer{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;}
.rev-status-badge{font-size:0.69rem;font-weight:700;padding:0.2rem 0.6rem;border-radius:20px;}
.badge-approved{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;}
.badge-pending {background:#fffbeb;color:#b45309;border:1px solid #fde68a;}
.rev-actions{display:flex;gap:0.35rem;flex-wrap:wrap;}
.rev-btn{padding:0.34rem 0.65rem;border-radius:8px;font-size:0.73rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:1.5px solid;transition:all 0.18s;white-space:nowrap;}
.rev-btn-approve  {background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.rev-btn-approve:hover  {background:var(--success);color:#fff;border-color:var(--success);}
.rev-btn-unapprove{background:#fffbeb;color:#b45309;border-color:#fde68a;}
.rev-btn-unapprove:hover{background:#f59e0b;color:#fff;border-color:#f59e0b;}
.rev-btn-edit  {background:var(--accent-lt);color:var(--accent);border-color:#bfdbfe;}
.rev-btn-edit:hover  {background:var(--accent);color:#fff;border-color:var(--accent);}
.rev-btn-delete{background:#fef2f2;color:var(--danger);border-color:#fecaca;}
.rev-btn-delete:hover{background:var(--danger);color:#fff;border-color:var(--danger);}

/* LOADING + EMPTY */
.rev-loading{display:flex;flex-direction:column;align-items:center;gap:0.75rem;padding:3rem;color:var(--fg3);font-size:0.85rem;grid-column:1/-1;}
.rev-spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.rev-empty{display:flex;flex-direction:column;align-items:center;gap:0.55rem;padding:3rem;grid-column:1/-1;}
.rev-empty-icon{font-size:2.8rem;opacity:0.4;}
.rev-empty-title{font-size:1.05rem;font-weight:700;color:var(--fg2);}
.rev-empty-sub{font-size:0.82rem;color:var(--fg3);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--surface);border-radius:20px;width:100%;max-width:500px;box-shadow:0 24px 60px rgba(0,0,0,0.25);animation:modalIn 0.3s ease both;margin:auto;overflow:hidden;}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:0.95rem 1.2rem;border-bottom:1px solid var(--border);}
.modal-title{font-size:0.95rem;font-weight:800;color:var(--fg);}
.modal-close{background:none;border:none;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--fg2);transition:all 0.2s;}
.modal-close:hover{background:#fef2f2;color:var(--danger);}
.modal-body{padding:1.2rem;}
.mf-row{margin-bottom:0.85rem;}
.mf-label{display:block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg2);margin-bottom:0.35rem;}
.mf-input,.mf-select,.mf-textarea{width:100%;padding:0.62rem 0.85rem;border:1.5px solid var(--border);border-radius:10px;font-size:0.85rem;font-family:'Inter',sans-serif;color:var(--fg);outline:none;background:var(--surface);transition:border-color 0.2s;}
.mf-input:focus,.mf-select:focus,.mf-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.08);}
.mf-textarea{resize:vertical;min-height:88px;}
.mf-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.65rem;}
.star-preview{font-size:1.2rem;letter-spacing:2px;margin-top:0.3rem;}
.mf-toggle-row{display:flex;align-items:center;gap:0.7rem;padding:0.75rem 0.85rem;background:var(--surface2);border-radius:10px;border:1.5px solid var(--border);cursor:pointer;}
.modal-save-btn{width:100%;padding:0.82rem;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:0.92rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,0.3);transition:all 0.2s;margin-top:0.3rem;}
.modal-save-btn:hover{opacity:0.9;transform:translateY(-1px);}
.modal-save-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

/* TOAST */
.admin-toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(20px);font-size:0.82rem;font-weight:700;padding:0.65rem 1.4rem;border-radius:30px;opacity:0;white-space:nowrap;transition:opacity 0.25s,transform 0.25s;z-index:9999;pointer-events:none;font-family:'Inter',sans-serif;}
.admin-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.admin-toast.success{background:#166534;color:#bbf7d0;border:1px solid #15803d;}
.admin-toast.error  {background:#7f1d1d;color:#fca5a5;border:1px solid #b91c1c;}
.admin-toast.warning{background:#78350f;color:#fde68a;border:1px solid #b45309;}
.admin-toast.info   {background:#1e3a8a;color:#bfdbfe;border:1px solid #1d4ed8;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,0.08);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.22rem;text-decoration:none;color:var(--fg3);border:none;background:none;cursor:pointer;font-family:'Inter',sans-serif;transition:color 0.18s;padding:0;}
.bn-item:hover,.bn-item.active{color:var(--accent);}
.bn-icon{font-size:1.25rem;line-height:1;}
.bn-label{font-size:0.6rem;font-weight:600;letter-spacing:0.04em;}

/* MORE MENU */
.more-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:none;}
.more-overlay.open{display:block;}
.more-menu{position:fixed;bottom:0;left:0;right:0;z-index:310;background:var(--surface);border-radius:20px 20px 0 0;padding:0.6rem 1.2rem 2rem;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 -8px 30px rgba(0,0,0,0.15);}
.more-menu.open{transform:translateY(0);}
.more-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0.5rem auto 1rem;}
.more-title{font-size:0.72rem;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.85rem;}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;}
.mm-item{display:flex;flex-direction:column;align-items:center;gap:0.35rem;padding:0.75rem 0.5rem;border-radius:12px;background:var(--surface2);text-decoration:none;color:var(--fg2);border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.18s;}
.mm-item:hover,.mm-item.mm-active{background:var(--accent-lt);color:var(--accent);}
.mm-item.mm-logout{color:var(--danger);}
.mm-item.mm-logout:hover{background:#fef2f2;}
.mm-icon{font-size:1.4rem;}
.mm-label{font-size:0.67rem;font-weight:600;text-align:center;}

@media(max-width:768px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .reviews-grid{grid-template-columns:1fr;}
  .mf-grid{grid-template-columns:1fr;}
}
@media(max-width:480px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .bulk-bar{flex-wrap:wrap;}
}
</style>
</head>
<body>

<main class="admin-main" id="reviewsPage">

  <!-- HEADER -->
  <header class="admin-header">
    <div class="header-title">⭐ Reviews</div>
    <div class="header-right">
      <button class="hdr-btn hdr-btn-export" onclick="exportReviewsCSV()">📥 Export CSV</button>
      <button class="install-btn" id="installBtn" onclick="installAdminApp()">📲 Install</button>
      <div class="header-admin-name">
        <div class="header-av">A</div>
        <span id="adminHeaderName">Admin</span>
      </div>
    </div>
  </header>

  <div class="admin-content">

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card sc-blue">
        <span class="stat-emoji">⭐</span>
        <span class="stat-num" id="rev-stat-total">—</span>
        <span class="stat-lbl">Total Reviews</span>
      </div>
      <div class="stat-card sc-yellow">
        <span class="stat-emoji">⏳</span>
        <span class="stat-num" id="rev-stat-pending">—</span>
        <span class="stat-lbl">Pending</span>
      </div>
      <div class="stat-card sc-green">
        <span class="stat-emoji">✅</span>
        <span class="stat-num" id="rev-stat-approved">—</span>
        <span class="stat-lbl">Approved</span>
      </div>
      <div class="stat-card sc-purple">
        <span class="stat-emoji">📊</span>
        <span class="stat-num" id="rev-stat-avg">—</span>
        <span class="stat-lbl">Avg Rating</span>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <span style="color:var(--fg3);">🔍</span>
        <input class="search-input" type="text"
               placeholder="Naam, template, review text se dhundho..."
               oninput="onRevSearch(this.value)"/>
      </div>
      <select class="sort-select" onchange="onRevSort(this.value)">
        <option value="newest">🕐 Newest First</option>
        <option value="oldest">🕐 Oldest First</option>
        <option value="highest">⭐ Highest Rating</option>
        <option value="lowest">⭐ Lowest Rating</option>
      </select>
      <span class="showing-txt" id="rev-showing">Loading...</span>
    </div>

    <!-- FILTER TABS -->
    <div class="rev-tabs">
      <button class="rev-tab active" data-filter="all" onclick="switchRevFilter('all')">
        All <span class="rev-tab-count" id="rev-count-all">—</span>
      </button>
      <button class="rev-tab" data-filter="pending" onclick="switchRevFilter('pending')">
        ⏳ Pending <span class="rev-tab-count" id="rev-count-pending">—</span>
      </button>
      <button class="rev-tab" data-filter="approved" onclick="switchRevFilter('approved')">
        ✅ Approved <span class="rev-tab-count" id="rev-count-approved">—</span>
      </button>
    </div>

    <!-- SELECT ROW -->
    <div class="select-row">
      <button onclick="selectAllPending()">⏳ Select All Pending</button>
      <button onclick="clearSelection()">✕ Clear Selection</button>
    </div>

    <!-- BULK ACTION BAR -->
    <div class="bulk-bar" id="bulkBar">
      <div class="bulk-count"><span id="bulkCount">0</span> reviews selected</div>
      <div class="bulk-actions">
        <button class="bulk-btn bulk-btn-approve" id="bulkApproveBtn"
                onclick="bulkApprove()">✅ Approve Selected</button>
        <button class="bulk-btn bulk-btn-delete" onclick="bulkDelete()">🗑️ Delete Selected</button>
        <button class="bulk-btn bulk-btn-clear"  onclick="clearSelection()">✕ Clear</button>
      </div>
    </div>

    <!-- REVIEWS GRID -->
    <div class="reviews-grid" id="reviewsGrid">
      <div class="rev-loading">
        <div class="rev-spinner"></div>
        <span>Reviews load ho rahi hain...</span>
      </div>
    </div>

  </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="admin-dashboard.html" class="bn-item"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></a>
  <a href="admin-bookings.html" class="bn-item"><span class="bn-icon">📦</span><span class="bn-label">Bookings</span></a>
  <a href="admin-templates.html" class="bn-item"><span class="bn-icon">🎨</span><span class="bn-label">Templates</span></a>
  <a href="admin-reviews.html" class="bn-item active"><span class="bn-icon">⭐</span><span class="bn-label">Reviews</span></a>
  <button class="bn-item" onclick="toggleMoreMenu()"><span class="bn-icon">⋯</span><span class="bn-label">More</span></button>
</nav>

<!-- MORE MENU -->
<div class="more-overlay" id="moreOverlay" onclick="toggleMoreMenu()"></div>
<div class="more-menu" id="moreMenu">
  <div class="more-handle"></div>
  <div class="more-title">More Pages</div>
  <div class="more-grid">
    <a href="admin-users.html" class="mm-item"><span class="mm-icon">👥</span><span class="mm-label">Users</span></a>

    </div>

      <div class="mf-grid">
        <div class="mf-row">
          <label class="mf-label">Reviewer Name *</label>

        </div>
        <div class="mf-row">
          <label class="mf-label">Template</label>
          <select class="mf-select" id="rev-edit-template">

            <option value="Crimson Royale">Crimson Royale</option>
            <option value="Royal Elegance">Royal Elegance</option>
            <option value="Garden Romance">Garden Romance</option>
            <option value="Rose Gold Blush">Rose Gold Blush</option>
            <option value="Midnight Royal">Midnight Royal</option>
          </select>
        </div>
      </div>

      <div class="mf-row">
        <label class="mf-label">Rating (1–5)</label>
        <input class="mf-input" type="range" id="rev-edit-rating"
               min="1" max="5" step="1" value="5"
               oninput="updateStarPreview(this.value)"
               style="padding:0.3rem 0;"/>
        <div class="star-preview" id="rev-star-preview">⭐⭐⭐⭐⭐</div>
      </div>

      <div class="mf-row">
        <label class="mf-label">Review Text *</label>
        <textarea class="mf-textarea" id="rev-edit-text"
                  placeholder="Review content..."></textarea>
      </div>

      <div class="mf-row">
        <div class="mf-toggle-row" onclick="document.getElementById('rev-edit-approved').click()">
          <input type="checkbox" id="rev-edit-approved"
                 style="width:18px;height:18px;accent-color:#16a34a;cursor:pointer;"/>
          <label style="font-size:0.85rem;font-weight:600;cursor:pointer;color:var(--fg);"
                 for="rev-edit-approved">✅ Approve This Review</label>
        </div>
      </div>

      <button class="modal-save-btn" id="revSaveBtn" onclick="saveRevEdit()">
        💾 Save Karo
      </button>
    </div>
  </div>

<script>
// Header avatar — preserved from original
const sess = JSON.parse(localStorage.getItem('adminSession')||'{}');
const av = document.querySelector('.header-av');
if(av && sess.displayName) av.textContent = sess.displayName.charAt(0).toUpperCase();

// More menu
function toggleMoreMenu(){
  const m=document.getElementById('moreMenu'),
        o=document.getElementById('moreOverlay'),
        open=m.classList.toggle('open');
  o.classList.toggle('open',open);
  document.body.style.overflow=open?'hidden':'';
}

// PWA Install
let _dp=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();_dp=e;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='flex';
});
function installAdminApp(){
  if(!_dp)return;
  _dp.prompt();
  _dp.userChoice.then(()=>{
    _dp=null;
    const b=document.getElementById('installBtn');
    if(b)b.style.display='none';
  });
}
window.addEventListener('appinstalled',()=>{
  _dp=null;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='none';
});
if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
