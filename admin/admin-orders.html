<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Orders — AKANS Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="manifest" href="admin-manifest.json"/>
<meta name="theme-color" content="#2563eb"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="AKANS Admin"/>
<style>
:root{
  --bg:#f1f5f9;--surface:#ffffff;--surface2:#f8fafc;
  --border:#e2e8f0;--fg:#0f172a;--fg2:#475569;--fg3:#94a3b8;
  --accent:#2563eb;--accent-lt:#eff6ff;
  --success:#16a34a;--warn:#d97706;--danger:#dc2626;
  --nav-h:64px;--radius:12px;--shadow:0 1px 4px rgba(0,0,0,0.07);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);overflow-x:hidden;}

.admin-main{display:flex;flex-direction:column;min-height:100vh;}

/* HEADER */
.admin-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0.85rem 1.1rem;display:flex;align-items:center;gap:0.8rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-title{font-size:1rem;font-weight:800;color:var(--fg);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:0.6rem;}
.header-admin-name{display:flex;align-items:center;gap:0.45rem;font-size:0.8rem;font-weight:700;color:var(--fg);}
.header-av{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.72rem;font-weight:800;}
.hdr-btn{display:flex;align-items:center;gap:0.4rem;padding:0.45rem 0.9rem;border-radius:9px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:1.5px solid;transition:all 0.2s;}
.hdr-btn-export{background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.hdr-btn-export:hover{background:var(--success);color:#fff;border-color:var(--success);}
.install-btn{display:none;align-items:center;gap:0.4rem;padding:0.42rem 0.8rem;border-radius:9px;font-size:0.76rem;font-weight:700;background:var(--accent-lt);color:var(--accent);border:1.5px solid #bfdbfe;cursor:pointer;font-family:'Inter',sans-serif;}

/* CONTENT */
.admin-content{padding:1.1rem;flex:1;padding-bottom:calc(var(--nav-h) + 16px);}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:0.65rem;margin-bottom:1.2rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0.85rem 0.8rem;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;}
.stat-card:hover,.stat-card.active{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.09);}
.stat-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,0.15);}
.stat-emoji{font-size:1.3rem;display:block;margin-bottom:0.22rem;}
.stat-num{font-size:1.38rem;font-weight:800;display:block;line-height:1;}
.stat-lbl{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--fg3);margin-top:0.2rem;display:block;}
.sc-blue   .stat-num{color:var(--accent);}
.sc-green  .stat-num{color:var(--success);}
.sc-orange .stat-num{color:#f59e0b;}
.sc-red    .stat-num{color:var(--danger);}
.sc-purple .stat-num{color:#7c3aed;}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.85rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:200px;display:flex;align-items:center;gap:0.5rem;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:0 0.85rem;transition:border-color 0.2s;}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.08);}
.search-input{flex:1;border:none;background:transparent;outline:none;font-size:0.84rem;font-family:'Inter',sans-serif;color:var(--fg);padding:0.58rem 0;}
.search-input::placeholder{color:var(--fg3);}
.showing-txt{font-size:0.74rem;color:var(--fg3);font-weight:600;white-space:nowrap;}

/* FILTER TABS */
.ord-tabs{display:flex;gap:0.3rem;margin-bottom:0.9rem;flex-wrap:wrap;}
.ord-tab{display:flex;align-items:center;gap:0.3rem;padding:0.36rem 0.85rem;border-radius:30px;border:1.5px solid var(--border);background:var(--surface);font-size:0.74rem;font-weight:700;color:var(--fg2);cursor:pointer;transition:all 0.18s;font-family:'Inter',sans-serif;white-space:nowrap;}
.ord-tab:hover{border-color:rgba(37,99,235,0.3);color:var(--accent);background:var(--accent-lt);}
.ord-tab.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(37,99,235,0.3);}
.ord-tab-count{background:rgba(0,0,0,0.1);border-radius:20px;padding:0.05rem 0.42rem;font-size:0.67rem;}
.ord-tab.active .ord-tab-count{background:rgba(255,255,255,0.25);}

/* ORDERS GRID */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:0.9rem;}

/* ORDER CARD */
.ord-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem;box-shadow:var(--shadow);transition:transform 0.2s,box-shadow 0.2s;animation:cardIn 0.3s ease both;}
.ord-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08);}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.ord-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.65rem;gap:0.5rem;}
.ord-id{font-size:0.72rem;font-weight:800;color:var(--fg3);letter-spacing:0.04em;}
.ord-status-pill{display:inline-flex;align-items:center;gap:0.25rem;font-size:0.67rem;font-weight:700;padding:0.22rem 0.65rem;border-radius:20px;border:1.5px solid;white-space:nowrap;}
.ost-active   {background:#eff6ff;color:var(--accent);border-color:#bfdbfe;}
.ost-delivered{background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.ost-expired  {background:#fef2f2;color:var(--danger);border-color:#fecaca;}

.ord-template{font-size:0.88rem;font-weight:700;color:var(--fg);margin-bottom:0.22rem;}
.ord-couple  {font-size:0.78rem;color:var(--fg2);margin-bottom:0.6rem;}

.ord-meta-row{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.6rem;}
.ord-amount{font-size:0.95rem;font-weight:800;color:var(--success);}
.ord-meta-row small{font-size:0.7rem;color:var(--fg3);}

.ord-link-row{display:flex;align-items:center;gap:0.45rem;padding:0.45rem 0.6rem;background:var(--surface2);border-radius:9px;margin-bottom:0.7rem;min-height:34px;}
.ord-link-label{font-size:0.65rem;font-weight:700;color:var(--fg3);white-space:nowrap;flex-shrink:0;}
.ord-link-val{font-size:0.72rem;color:var(--accent);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ord-no-link{font-size:0.72rem;color:var(--fg3);flex:1;}

.ord-actions{display:flex;gap:0.35rem;flex-wrap:wrap;}
.ord-btn{display:flex;align-items:center;justify-content:center;gap:0.3rem;padding:0.38rem 0.65rem;border-radius:8px;font-size:0.73rem;font-weight:700;cursor:pointer;border:1.5px solid;font-family:'Inter',sans-serif;text-decoration:none;transition:all 0.18s;white-space:nowrap;}
.ord-btn-edit   {background:var(--accent-lt);color:var(--accent);border-color:#bfdbfe;flex:1;}
.ord-btn-edit:hover   {background:var(--accent);color:#fff;border-color:var(--accent);}
.ord-btn-link   {background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.ord-btn-link:hover   {background:var(--success);color:#fff;}
.ord-btn-addlink{background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.ord-btn-addlink:hover{background:var(--success);color:#fff;}
.ord-btn-wa     {background:#f0fdf4;color:var(--success);border-color:#bbf7d0;}
.ord-btn-wa:hover     {background:var(--success);color:#fff;}
.ord-btn-delete {background:#fef2f2;color:var(--danger);border-color:#fecaca;}
.ord-btn-delete:hover {background:var(--danger);color:#fff;}

/* LOADING + EMPTY */
.ord-loading{display:flex;flex-direction:column;align-items:center;gap:0.75rem;padding:3rem;color:var(--fg3);font-size:0.85rem;grid-column:1/-1;}
.ord-spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ord-empty{display:flex;flex-direction:column;align-items:center;gap:0.55rem;padding:3rem;grid-column:1/-1;}
.ord-empty-icon{font-size:2.8rem;opacity:0.4;}
.ord-empty-title{font-size:1.05rem;font-weight:700;color:var(--fg2);}
.ord-empty-sub{font-size:0.82rem;color:var(--fg3);}

/* EDIT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--surface);border-radius:20px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,0.25);animation:modalIn 0.3s ease both;margin:auto;overflow:hidden;}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:0.95rem 1.2rem;border-bottom:1px solid var(--border);}
.modal-title{font-size:0.95rem;font-weight:800;color:var(--fg);}
.modal-close{background:none;border:none;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--fg2);transition:all 0.2s;}
.modal-close:hover{background:#fef2f2;color:var(--danger);}
.modal-body{padding:1.2rem;max-height:70vh;overflow-y:auto;}

/* Order info box */
.ord-info-box{background:var(--surface2);border-radius:12px;padding:0.9rem;margin-bottom:1.1rem;display:flex;flex-direction:column;gap:0.38rem;}
.oib-item{display:flex;gap:0.5rem;font-size:0.8rem;}
.oib-item strong{color:var(--fg3);min-width:80px;font-weight:700;font-size:0.72rem;}
.oib-item span{color:var(--fg);font-weight:600;}

/* Modal form fields */
.mf-row{margin-bottom:0.85rem;}
.mf-label{display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--fg3);margin-bottom:0.35rem;}
.mf-input,.mf-select,.mf-textarea{width:100%;padding:0.6rem 0.85rem;border:1.5px solid var(--border);border-radius:10px;font-size:0.84rem;font-family:'Inter',sans-serif;color:var(--fg);background:var(--surface);outline:none;transition:border-color 0.2s;}
.mf-input:focus,.mf-select:focus,.mf-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.08);}
.mf-textarea{resize:vertical;min-height:80px;}
.mf-hint{font-size:0.71rem;color:var(--fg3);margin-top:0.28rem;}

.modal-save-btn{width:100%;padding:0.72rem;background:var(--accent);color:#fff;border:none;border-radius:11px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;margin-top:0.5rem;}
.modal-save-btn:hover{background:#1d4ed8;transform:translateY(-1px);}
.modal-save-btn:active{transform:translateY(0);}

/* TOAST */
.admin-toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(20px);font-size:0.82rem;font-weight:700;padding:0.65rem 1.4rem;border-radius:30px;opacity:0;white-space:nowrap;transition:opacity 0.25s,transform 0.25s;z-index:9999;pointer-events:none;font-family:'Inter',sans-serif;}
.admin-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.admin-toast.success{background:#166534;color:#bbf7d0;border:1px solid #15803d;}
.admin-toast.error  {background:#7f1d1d;color:#fca5a5;border:1px solid #b91c1c;}
.admin-toast.warning{background:#78350f;color:#fde68a;border:1px solid #b45309;}
.admin-toast.info   {background:#1e3a8a;color:#bfdbfe;border:1px solid #1d4ed8;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,0.08);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.22rem;text-decoration:none;color:var(--fg3);border:none;background:none;cursor:pointer;font-family:'Inter',sans-serif;transition:color 0.18s;padding:0;}
.bn-item:hover,.bn-item.active{color:var(--accent);}
.bn-icon{font-size:1.25rem;line-height:1;}
.bn-label{font-size:0.6rem;font-weight:600;letter-spacing:0.04em;}

/* MORE MENU */
.more-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:none;}
.more-overlay.open{display:block;}
.more-menu{position:fixed;bottom:0;left:0;right:0;z-index:310;background:var(--surface);border-radius:20px 20px 0 0;padding:0.6rem 1.2rem 2rem;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 -8px 30px rgba(0,0,0,0.15);}
.more-menu.open{transform:translateY(0);}
.more-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0.5rem auto 1rem;}
.more-title{font-size:0.72rem;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.85rem;}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;}
.mm-item{display:flex;flex-direction:column;align-items:center;gap:0.35rem;padding:0.75rem 0.5rem;border-radius:12px;background:var(--surface2);text-decoration:none;color:var(--fg2);border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.18s;}
.mm-item:hover,.mm-item.mm-active{background:var(--accent-lt);color:var(--accent);}
.mm-item.mm-logout{color:var(--danger);}
.mm-item.mm-logout:hover{background:#fef2f2;}
.mm-icon{font-size:1.4rem;}
.mm-label{font-size:0.67rem;font-weight:600;text-align:center;}

@media(max-width:768px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .stats-row .stat-card:last-child{grid-column:span 2;}
  .orders-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<main class="admin-main" id="ordersPage">

  <!-- HEADER -->
  <header class="admin-header">
    <div class="header-title">🛒 Orders</div>
    <div class="header-right">
      <button class="hdr-btn hdr-btn-export" onclick="exportOrdersCSV()">📥 Export CSV</button>
      <button class="install-btn" id="installBtn" onclick="installAdminApp()">📲 Install</button>
      <div class="header-admin-name">
        <div class="header-av">A</div>
        <span id="adminHeaderName">Admin</span>
      </div>
    </div>
  </header>

  <div class="admin-content">

    <!-- STATS (clickable to filter) -->
    <div class="stats-row">
      <div class="stat-card sc-blue" onclick="switchOrdFilter('all')" id="ord-stat-total-card">
        <span class="stat-emoji">🛒</span>
        <span class="stat-num" id="ord-stat-total">—</span>
        <span class="stat-lbl">Total</span>
      </div>
      <div class="stat-card sc-green" onclick="switchOrdFilter('active')" id="ord-stat-active-card">
        <span class="stat-emoji">⚡</span>
        <span class="stat-num" id="ord-stat-active">—</span>
        <span class="stat-lbl">Active</span>
      </div>
      <div class="stat-card sc-orange" onclick="switchOrdFilter('delivered')" id="ord-stat-delivered-card">
        <span class="stat-emoji">✅</span>
        <span class="stat-num" id="ord-stat-delivered">—</span>
        <span class="stat-lbl">Delivered</span>
      </div>
      <div class="stat-card sc-red" onclick="switchOrdFilter('expired')" id="ord-stat-expired-card">
        <span class="stat-emoji">⏰</span>
        <span class="stat-num" id="ord-stat-expired">—</span>
        <span class="stat-lbl">Expired</span>
      </div>
      <div class="stat-card sc-purple">
        <span class="stat-emoji">💰</span>
        <span class="stat-num" id="ord-stat-revenue">—</span>
        <span class="stat-lbl">Revenue</span>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <span style="color:var(--fg3);">🔍</span>
        <input class="search-input" type="text"
               placeholder="Order ID, naam, template se dhundho..."
               oninput="onOrdSearch(this.value)"/>
      </div>
      <span class="showing-txt" id="ord-showing">Loading...</span>
    </div>

    <!-- FILTER TABS -->
    <div class="ord-tabs">
      <button class="ord-tab active" data-filter="all"       onclick="switchOrdFilter('all')">All <span class="ord-tab-count" id="cnt-all">0</span></button>
      <button class="ord-tab"        data-filter="active"    onclick="switchOrdFilter('active')">⚡ Active <span class="ord-tab-count" id="cnt-active">0</span></button>
      <button class="ord-tab"        data-filter="delivered" onclick="switchOrdFilter('delivered')">✅ Delivered <span class="ord-tab-count" id="cnt-delivered">0</span></button>
      <button class="ord-tab"        data-filter="expired"   onclick="switchOrdFilter('expired')">⏰ Expired <span class="ord-tab-count" id="cnt-expired">0</span></button>
    </div>

    <!-- ORDERS GRID -->
    <div class="orders-grid" id="ordersGrid">
      <div class="ord-loading">
        <div class="ord-spinner"></div>
        <span>Orders load ho rahe hain...</span>
      </div>
    </div>

  </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="admin-dashboard.html" class="bn-item"><span class="bn-icon">🏠</span><span class="bn-label">Home</span></a>
  <a href="admin-bookings.html" class="bn-item"><span class="bn-icon">📦</span><span class="bn-label">Bookings</span></a>
  <a href="admin-templates.html" class="bn-item"><span class="bn-icon">🎨</span><span class="bn-label">Templates</span></a>
  <a href="admin-reviews.html" class="bn-item"><span class="bn-icon">⭐</span><span class="bn-label">Reviews</span></a>
  <button class="bn-item active" onclick="toggleMoreMenu()"><span class="bn-icon">⋯</span><span class="bn-label">More</span></button>
</nav>

<!-- MORE MENU -->
<div class="more-overlay" id="moreOverlay" onclick="toggleMoreMenu()"></div>
<div class="more-menu" id="moreMenu">
  <div class="more-handle"></div>
  <div class="more-title">More Pages</div>
  <div class="more-grid">
    <a href="admin-users.html" class="mm-item"><span class="mm-icon">👥</span><span class="mm-label">Users</span></a>
    <a href="admin-orders.html" class="mm-item mm-active"><span class="mm-icon">🛒</span><span class="mm-label">Orders</span></a>
    <a href="admin-coupons.html" class="mm-item"><span class="mm-icon">🎟️</span><span class="mm-label">Coupons</span></a>
    <a href="admin-referrals.html" class="mm-item"><span class="mm-icon">🔗</span><span class="mm-label">Referrals</span></a>
    <a href="admin-whatsapp.html" class="mm-item"><span class="mm-icon">💬</span><span class="mm-label">WhatsApp</span></a>
    <a href="admin-settings.html" class="mm-item"><span class="mm-icon">⚙️</span><span class="mm-label">Settings</span></a>
    <button class="mm-item mm-logout" onclick="adminLogout()"><span class="mm-icon">🚪</span><span class="mm-label">Logout</span></button>
  </div>
</div>

<!-- EDIT ORDER MODAL -->
<div class="modal-overlay" id="orderEditModal" onclick="if(event.target===this)document.getElementById('orderEditModal').classList.remove('open')">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">✏️ Edit Order</div>
      <button class="modal-close" onclick="document.getElementById('orderEditModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="orderEditContent">
      <div style="text-align:center;padding:3rem;color:var(--fg3);">⏳ Loading...</div>
    </div>
  </div>
</div>

<div class="admin-toast" id="adminToast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="admin-all.js"></script>
<script src="admin-orders.js"></script>
<script>
// Header avatar — preserved from original
const sess = JSON.parse(localStorage.getItem('adminSession')||'{}');
const av = document.querySelector('.header-av');
if(av && sess.displayName) av.textContent = sess.displayName.charAt(0).toUpperCase();

// More menu
function toggleMoreMenu(){
  const m=document.getElementById('moreMenu'),
        o=document.getElementById('moreOverlay'),
        open=m.classList.toggle('open');
  o.classList.toggle('open',open);
  document.body.style.overflow=open?'hidden':'';
}

// PWA Install
let _dp=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();_dp=e;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='flex';
});
function installAdminApp(){
  if(!_dp)return;
  _dp.prompt();
  _dp.userChoice.then(()=>{
    _dp=null;
    const b=document.getElementById('installBtn');
    if(b)b.style.display='none';
  });
}
window.addEventListener('appinstalled',()=>{
  _dp=null;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='none';
});
if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
