<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>No Internet — AKANS Web Development Services</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --blue:   #2563eb;
  --purple: #7c3aed;
  --text:   #1a1f3c;
  --text-2: #4b5280;
  --text-3: #8890b5;
  --border: #dde2f5;
  --bg:     #f5f7ff;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }

body {
  min-height: 100vh;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  text-align: center;
  padding: 2rem 1.5rem;
  position: relative; overflow: hidden;
}

/* background glow */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 50% at 15% 10%, rgba(37,99,235,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 85% 90%, rgba(124,58,237,0.07) 0%, transparent 60%);
}

.card {
  position: relative; z-index: 1;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 3rem 2.5rem 2.5rem;
  max-width: 400px; width: 100%;
  box-shadow: 0 8px 40px rgba(37,99,235,0.12), 0 2px 8px rgba(0,0,0,0.06);
  animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}

/* animated WiFi icon */
.wifi-wrap {
  width: 90px; height: 90px; margin: 0 auto 1.8rem;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.wifi-bg {
  width: 90px; height: 90px; border-radius: 50%;
  background: linear-gradient(135deg, #eff4ff, #f3eeff);
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem;
  animation: pulse-icon 2.5s ease-in-out infinite;
}
@keyframes pulse-icon {
  0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,99,235,0.15); }
  50%      { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(37,99,235,0); }
}

/* signal bars (animated) */
.signal {
  position: absolute; bottom: 4px; right: 4px;
  display: flex; align-items: flex-end; gap: 3px;
  background: #fff; border-radius: 8px; padding: 4px 5px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.1);
}
.bar {
  width: 5px; border-radius: 2px 2px 0 0;
  background: var(--border);
  animation: blink 1.8s ease-in-out infinite;
}
.bar:nth-child(1) { height: 6px;  animation-delay: 0s; }
.bar:nth-child(2) { height: 10px; animation-delay: 0.2s; }
.bar:nth-child(3) { height: 14px; animation-delay: 0.4s; }
@keyframes blink {
  0%,100% { background: var(--border); }
  50%      { background: rgba(37,99,235,0.25); }
}

.brand {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--blue);
  margin-bottom: 0.6rem;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.7rem; font-weight: 900;
  color: var(--text); margin-bottom: 0.7rem; line-height: 1.2;
}

.sub {
  font-size: 0.9rem; color: var(--text-2);
  line-height: 1.75; margin-bottom: 2rem;
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin: 0 0 1.5rem;
}

/* offline features */
.features {
  display: flex; flex-direction: column; gap: 0.7rem;
  margin-bottom: 2rem; text-align: left;
}
.feature {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.75rem 0.9rem;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 12px; font-size: 0.84rem; color: var(--text-2);
}
.feature-icon {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px;
  background: #fff; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.feature strong { display: block; font-size: 0.84rem; color: var(--text); }
.feature span   { font-size: 0.73rem; }

/* retry button */
.retry-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #fff; border: none; padding: 0.9rem;
  border-radius: 14px; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  box-shadow: 0 4px 20px rgba(37,99,235,0.35);
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  margin-bottom: 0.9rem;
}
.retry-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,99,235,0.45); }
.retry-btn:active { transform: scale(0.97); }

.home-link {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.83rem; font-weight: 600; color: var(--text-3);
  text-decoration: none; transition: color 0.2s;
}
.home-link:hover { color: var(--blue); }

/* status dot */
.status-row {
  display: flex; align-items: center; justify-content: center;
  gap: 0.5rem; margin-top: 1.5rem;
  font-size: 0.72rem; color: var(--text-3);
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #ef4444;
  animation: status-pulse 1.5s ease-in-out infinite;
}
.status-dot.online { background: #22c55e; }
@keyframes status-pulse {
  0%,100% { opacity:1; } 50% { opacity:0.4; }
}

@keyframes popIn {
  from { opacity:0; transform:scale(0.88) translateY(20px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}

@media(max-width:440px){
  .card { padding: 2rem 1.4rem 1.8rem; }
  h1 { font-size: 1.45rem; }
}
</style>
</head>
<body>

<div class="card">

  <div class="wifi-wrap">
    <div class="wifi-bg">📶</div>
    <div class="signal">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <div class="brand">AKANS Web Development</div>
  <h1>No Internet Connection</h1>
  <p class="sub">
    Abhi internet nahi hai.<br>
    Connection check karo aur retry karo 📡
  </p>

  <div class="divider"></div>

  <!-- What still works offline -->
  <div class="features">
    <div class="feature">
      <div class="feature-icon">📋</div>
      <div>
        <strong>Cached Pages</strong>
        <span>Pehle se dekhe gaye pages kaam karenge</span>
      </div>
    </div>
    <div class="feature">
      <div class="feature-icon">🌐</div>
      <div>
        <strong>Online Hone Par</strong>
        <span>Sab automatically refresh ho jayega</span>
      </div>
    </div>
  </div>

  <button class="retry-btn" onclick="retryConnection()">
    🔄 Retry Connection
  </button>

  <a href="/AKANS_Web/" class="home-link">🏠 Go to Home Page</a>

  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Checking connection...</span>
  </div>

</div>

<script>
// Check online status and update UI
function updateStatus() {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if(navigator.onLine) {
    dot.classList.add('online');
    text.textContent = 'Connection restored! Redirecting...';
    setTimeout(() => window.location.href = '/AKANS_Web/', 1200);
  } else {
    dot.classList.remove('online');
    text.textContent = 'Still offline — please check your connection';
  }
}

function retryConnection() {
  const btn = document.querySelector('.retry-btn');
  btn.textContent = '⏳ Checking...';
  btn.disabled = true;
  setTimeout(() => {
    updateStatus();
    btn.textContent = '🔄 Retry Connection';
    btn.disabled = false;
  }, 1500);
}

// Auto-redirect when connection restores
window.addEventListener('online',  updateStatus);
window.addEventListener('offline', updateStatus);

// Initial check
updateStatus();
</script>

</body>
</html>
